<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q-3D Learn — Interactive Quantum Learning</title>
  <meta name="description" content="AI-powered interactive quantum learning platform: 3D Bloch sphere, circuit builder, real simulation and an AI tutor." />
  <meta name="theme-color" content="#060914" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".6"/><line x1="16" y1="16" x2="24" y2="8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="24" cy="8" r="2.6" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">Q-3D <b>Learn</b></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="home"><i data-icon="home"></i><span>Home</span></a>
      <div class="nav-label">Learn</div>
      <a href="#/learn" data-route="learn"><i data-icon="book"></i><span>Lessons</span></a>
      <a href="#/lab" data-route="lab"><i data-icon="sphere"></i><span>3D Lab</span></a>
      <a href="#/builder" data-route="builder"><i data-icon="circuit"></i><span>Circuit Builder</span></a>
      <a href="#/algorithms" data-route="algorithms"><i data-icon="flask"></i><span>Algorithms</span></a>
      <a href="#/challenges" data-route="challenges"><i data-icon="trophy"></i><span>Challenges</span></a>
      <a href="#/tutor" data-route="tutor"><i data-icon="bot"></i><span>AI Tutor</span></a>
      <div class="nav-label">Track</div>
      <a href="#/progress" data-route="progress"><i data-icon="chart"></i><span>My Progress</span></a>
      <a href="#/instructor" data-route="instructor"><i data-icon="users"></i><span>Instructor</span></a>
      <div class="nav-label">Project</div>
      <a href="#/about" data-route="about"><i data-icon="info"></i><span>About the Project</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="status-pill" id="status-pill" title="Backend status">
        <span class="dot"></span><span id="status-text">Connecting…</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><i data-icon="menu"></i></button>
      <h1 class="page-title" id="page-title">Q-3D Learn</h1>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm ask-btn" id="open-drawer"><i data-icon="bot"></i><span>Ask Q-Bot</span></button>
        <button class="user-chip" id="user-chip" aria-label="Profile"></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><b>Q-Bot</b><small id="drawer-provider">AI tutor</small></div>
      <button class="icon-btn" id="close-drawer" aria-label="Close"><i data-icon="x"></i></button>
    </div>
    <div class="drawer-body" id="drawer-chat"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
