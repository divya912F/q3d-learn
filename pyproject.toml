[project]
name = "q3d-learn"
version = "1.0.0"
description = "AI-powered interactive quantum learning platform with 3D visualisation, real simulation and an AI tutor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
